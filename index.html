<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CashToken Explorer</title>
    <meta name="description" content="Explore CashTokens metadata, supply, holders and authchain on Bitcoin Cash" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply a stored theme choice before first paint; without one, prefers-color-scheme decides (globals.css)
      try {
        var theme = localStorage.getItem('theme')
        if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
    <script defer data-domain="tokenexplorer.cash" src="https://plausible.io/js/script.js"></script>
    <script>window.plausible = window.plausible || function () { (window.plausible.q = window.plausible.q || []).push(arguments) }</script>
  </head>
  <body>
    <!-- Static placeholder until React mounts (replaced by createRoot().render) -->
    <div id="root"><p class="app-boot">Loading CashToken Explorer…</p></div>
    <noscript><p class="app-boot">CashToken Explorer needs JavaScript to look up tokens.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
